# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - qr2pay-app

on:
  push:
    branches:
      - feature-auth
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    environment: Test
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: npm run build

      - name: Verify deployment package
        run: |
          echo "Verifying deployment package contents..."
          ls -la
          echo "Checking for .next directory..."
          if [ -d ".next" ]; then
            echo "✅ .next directory found"
            ls -la .next/
            echo "Checking for BUILD_ID..."
            if [ -f ".next/BUILD_ID" ]; then
              echo "✅ BUILD_ID found: $(cat .next/BUILD_ID)"
            else
              echo "❌ BUILD_ID not found in deployment package"
              echo "This will cause production startup to fail"
              exit 1
            fi
          else
            echo "❌ .next directory not found in deployment package"
            exit 1
          fi
          echo "Checking for package.json..."
          ls -la package.json || echo "WARNING: package.json not found"
          echo "Deployment package verification complete"

      - name: Upload built artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: built-app
          path: .
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    environment: Production
    needs: build-test
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: built-app


      - name: Verify deployment package
        run: |
          echo "Verifying deployment package contents..."
          ls -la
          echo "Checking for .next directory..."
          if [ -d ".next" ]; then
            echo "✅ .next directory found"
            ls -la .next/
            echo "Checking for BUILD_ID..."
            if [ -f ".next/BUILD_ID" ]; then
              echo "✅ BUILD_ID found: $(cat .next/BUILD_ID)"
            else
              echo "❌ BUILD_ID not found in deployment package"
              echo "This will cause production startup to fail"
              exit 1
            fi
          else
            echo "❌ .next directory not found in deployment package"
            exit 1
          fi
          echo "Checking for package.json..."
          ls -la package.json || echo "WARNING: package.json not found"
          echo "Deployment package verification complete"          

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EE9C4E7BD4044ED39482EA6FD0924C86 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6704C8DBF5CA400B9399F40318056CA0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B1B669EDA2874ED8AF2E92127B6237A2 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qr2pay-test'
          slot-name: 'Production'
          package: .
          